name: Relatar um problema
description: Algo não funcionou como esperado no DuiaOS.
labels: [problema]
body:
  - type: input
    id: versao
    attributes:
      label: Versão do DuiaOS
      description: "Resultado do comando: cat /etc/os-release | head -n 1"
    validations:
      required: true
  - type: input
    id: computador
    attributes:
      label: Computador
      description: "Marca e modelo (ex.: Dell Latitude 3420)"
    validations:
      required: true
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu
      description: "O que você fez, o que esperava e o que aconteceu."
    validations:
      required: true
  - type: textarea
    id: verificacao
    attributes:
      label: Verificação (opcional)
      description: "Saída de: sudo /usr/lib/duiaos/verificar-instalacao"
      render: text
