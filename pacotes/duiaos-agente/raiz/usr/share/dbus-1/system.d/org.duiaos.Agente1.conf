<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- DuiaOS — agente do sistema (duiaos-agente). Qualquer programa pode pedir um
     plano (só simula); executar passa pelo polkit (org.duiaos.agente.*),
     conferido pelo próprio serviço. -->
<busconfig>
  <policy user="root">
    <allow own="org.duiaos.Agente1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.duiaos.Agente1" send_interface="org.duiaos.Agente1"/>
    <allow send_destination="org.duiaos.Agente1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.duiaos.Agente1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
