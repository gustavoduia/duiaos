<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- DuiaOS — serviço de IA (duiaos-ia). Qualquer programa pode falar com ele;
     as mudanças (baixar, ativar, remover) passam pelo polkit
     (org.duiaos.ia.gerenciar), conferido pelo próprio serviço. -->
<busconfig>
  <policy user="duiaos-ia">
    <allow own="org.duiaos.IA1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.duiaos.IA1" send_interface="org.duiaos.IA1"/>
    <allow send_destination="org.duiaos.IA1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.duiaos.IA1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
