# DuiaOS (pacote duiaos-shell) — prepara a configuração do greetd a cada
# início (no modo live, entra direto na sessão) e usa a cópia gerada em
# /run/duiaos. O /etc/greetd/config.toml do pacote greetd não é usado.
[Unit]
# Modo live: o usuário live é criado pelo live-config (no sistema instalado,
# este serviço não existe e a linha é ignorada).
After=live-config.service

[Service]
ExecStartPre=/usr/lib/duiaos/preparar-entrada
ExecStart=
ExecStart=/usr/sbin/greetd --config /run/duiaos/greetd.toml
