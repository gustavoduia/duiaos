# DuiaOS — modelo da configuração do gerenciador de login (greetd).
# /usr/lib/duiaos/preparar-entrada copia este modelo para /run/duiaos/greetd.toml
# a cada início do greetd (e, no modo live, acrescenta a entrada automática).
# Mostra a Tela de Entrada; depois da senha correta, abre a sessão do DuiaOS.

[terminal]
# Terminal virtual da tela gráfica
vt = 7

[default_session]
# A Tela de Entrada (QML), dentro do compositor cage
command = "/usr/share/duiaos/shell/entrada/iniciar"
user = "_greetd"
