# DuiaOS — menu de boot (GRUB) do sistema instalado.
# Depois de mudar este arquivo, aplique com: sudo update-grub
GRUB_DISTRIBUTOR="DuiaOS"
GRUB_TIMEOUT=5
GRUB_GFXMODE=auto
GRUB_THEME="/usr/share/grub/themes/duiaos/theme.txt"
# Dual boot: procura outros sistemas (ex.: Windows) e os coloca no menu
GRUB_DISABLE_OS_PROBER=false
# Animação de boot (Plymouth) no lugar das mensagens do sistema
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
