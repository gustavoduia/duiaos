# DuiaOS — inicialização (GRUB) do sistema instalado (ADR 054).
# Depois de mudar este arquivo, aplique com: sudo update-grub
GRUB_DISTRIBUTOR="DuiaOS"
# Sem menu ao ligar: o DuiaOS começa direto. Enquanto a logomarca aparece
# (2 segundos), a tecla F12 (ou Esc) abre a escolha do sistema (DuiaOS, Windows…).
# O /etc/grub.d/99_duiaos completa isso. Para voltar ao menu de sempre:
#   GRUB_TIMEOUT_STYLE=menu  e  GRUB_TIMEOUT=5
GRUB_TIMEOUT=2
GRUB_TIMEOUT_STYLE=hidden
GRUB_GFXMODE=auto
GRUB_THEME="/usr/share/grub/themes/duiaos/theme.txt"
# Dual boot: procura outros sistemas (ex.: Windows) e os coloca no menu
GRUB_DISABLE_OS_PROBER=false
# Só a tela do DuiaOS (Plymouth) ao ligar e ao desligar, sem texto:
#   quiet splash               animação no lugar das mensagens
#   loglevel=3                 o núcleo só escreve erros
#   systemd.show_status=auto   o systemd só escreve se algo falhar ou demorar
#   rd.udev.log_level=3        o udev só escreve erros
#   vt.global_cursor_default=0 sem o cursor piscando no canto
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3 vt.global_cursor_default=0"
