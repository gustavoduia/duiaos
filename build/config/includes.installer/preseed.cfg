# =============================================================================
# DuiaOS — respostas pré-definidas do instalador (provisório).
#
# O instalador é o debian-installer em modo "live": ele copia o sistema da
# ISO para o disco, sem precisar de internet. Ele pergunta só o usuário, a
# senha e o disco. No fim, o script /usr/lib/duiaos/pos-instalacao ajusta
# repositórios, idioma, teclado e SSH no sistema instalado.
# O instalador próprio do DuiaOS (Calamares) substitui este depois.
# =============================================================================

# Idioma e país: português do Brasil
d-i debian-installer/locale string pt_BR.UTF-8
d-i debian-installer/language string pt_BR
d-i debian-installer/country string BR

# Teclado: ABNT2 (layout br)
d-i keyboard-configuration/xkb-keymap select br

# Fuso horário e relógio
d-i clock-setup/utc boolean true
d-i time/zone string America/Sao_Paulo
d-i clock-setup/ntp boolean false

# Rede: não é usada na instalação (tudo vem da ISO). O Wi-Fi é configurado
# depois, no sistema instalado, com o comando nmtui.
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string duiaos
d-i netcfg/get_domain string
d-i netcfg/hostname string duiaos
d-i hw-detect/load_firmware boolean false

# Repositórios: o instalador não tenta acessar a internet; os repositórios
# do Debian são gravados pelo script de pós-instalação.
d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true

# Sem senha de root: o usuário criado na instalação administra o
# sistema com sudo.
d-i passwd/root-login boolean false

# Não participar da pesquisa de popularidade de pacotes do Debian
popularity-contest popularity-contest/participate boolean false

# Ajustes finais do DuiaOS no sistema instalado
d-i preseed/late_command string in-target /usr/lib/duiaos/pos-instalacao
