# =============================================================================
# DuiaOS — respostas pré-definidas do instalador (provisório, Fase 2).
#
# O instalador é o debian-installer em modo "live": ele copia o sistema da
# ISO para o disco. As respostas abaixo evitam perguntas repetitivas; o
# instalador continua perguntando o disco, o usuário e a senha.
# O instalador próprio do DuiaOS (Calamares) chega na Fase 6.
# =============================================================================

# Idioma e país: português do Brasil
d-i debian-installer/locale string pt_BR.UTF-8
d-i debian-installer/language string pt_BR
d-i debian-installer/country string BR

# Teclado: ABNT2 já selecionado, mas a pergunta continua aparecendo
# para quem usa outro teclado (ex.: americano).
d-i keyboard-configuration/xkb-keymap select br
d-i keyboard-configuration/xkb-keymap seen false

# Fuso horário e relógio
d-i clock-setup/utc boolean true
d-i time/zone string America/Sao_Paulo
d-i clock-setup/ntp boolean true

# Firmwares: o instalador não procura firmwares em mídias externas.
# A instalação copia tudo da ISO e não precisa de internet; o sistema
# instalado já vem com os firmwares (Wi-Fi, vídeo, áudio) do DuiaOS.
d-i hw-detect/load_firmware boolean false

# Nome do computador
d-i netcfg/get_hostname string duiaos
d-i netcfg/get_domain string
d-i netcfg/hostname string duiaos

# A rede do sistema instalado fica com o NetworkManager
# (Wi-Fi e cabo configuráveis depois com o comando nmtui).
d-i netcfg/target_network_config select nm_config

# Repositórios do Debian 13 com firmwares e atualizações de segurança
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates

# Sem senha de root: o usuário criado na instalação administra o
# sistema com sudo.
d-i passwd/root-login boolean false

# Não participar da pesquisa de popularidade de pacotes do Debian
popularity-contest popularity-contest/participate boolean false
