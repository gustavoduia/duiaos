<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120">
  <!-- Animação de boot (Plymouth): nome DuiaOS (requer a fonte Manrope ao gerar).
       Duas partes com posição fixa (centralizadas à mão) para o gerador não
       separar "Duia" de "OS". -->
  <text x="104" y="84" font-family="Manrope" font-size="80" font-weight="800" letter-spacing="-2.4" fill="#1A3A73">Duia</text>
  <text x="272" y="84" font-family="Manrope" font-size="80" font-weight="500" letter-spacing="-2.4" fill="#2E6BE6">OS</text>
</svg>
