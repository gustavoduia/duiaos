<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Fundo do menu de boot do DuiaOS (GRUB). Gerar o PNG com:
       rsvg-convert, 800 x 600 pixels, saída em build/config/bootloaders/grub-pc/splash.png
       (requer o pacote fonts-manrope) -->
  <rect width="800" height="600" fill="#F7F9FC"/>
  <svg x="350" y="64" width="100" height="100" viewBox="12 8 104 104">
    <path d="M58 100H28V20H58A40 40 0 0 1 95.59 73.68" fill="none" stroke="#1A3A73" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="80.94" cy="92.77" r="8" fill="#2E6BE6"/>
  </svg>
  <text x="400" y="226" text-anchor="middle" font-family="Manrope" font-size="40" letter-spacing="-1.2"><tspan font-weight="800" fill="#1A3A73">Duia</tspan><tspan font-weight="500" fill="#2E6BE6">OS</tspan></text>
  <text x="400" y="258" text-anchor="middle" font-family="Manrope" font-size="15" font-weight="500" fill="#5B6675">Zoinho</text>
</svg>
