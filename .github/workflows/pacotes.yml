# DuiaOS — gera os pacotes .deb do código próprio e os publica no repositório
# apt do DuiaOS (ADR 023 e 028).
#
# Repositório apt: branch gh-pages do repositório público, pasta apt/,
# servido pelo GitHub Pages em https://gustavoduia.github.io/duiaos-fontes-abertas/apt
# Fluxo único de atualizações (ADR 074): todo envio à main e toda tag publicam
# para TODOS os computadores, de qualquer ISO (canais "estavel" e "teste" com o
# mesmo índice):
#   - envio para a main  -> versão X.Y.Z+gitDATA.SHA
#   - tag vX.Y.Z         -> versão X.Y.Z (só no commit mais novo da main)
#
# Segredos: DUIAOS_APT_CHAVE (chave privada de assinatura, criada por
# ferramentas/criar-chave-apt.sh) e DUIAOS_TOKEN_PUBLICO (escrita no
# repositório público).
name: Pacotes e repositório apt

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Só documentação, memórias e decisões não chegam aos computadores: não viram uma "atualização" de 9 pacotes
    # sem descrição (relato do Gustavo, 23/11, ADR 081). As tags não passam por este filtro.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "notas-de-versao/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

# Uma publicação por vez (todas mexem na mesma branch gh-pages)
concurrency:
  group: repositorio-apt
  cancel-in-progress: false

env:
  REPO_PUBLICO: ${{ vars.DUIAOS_REPO_PUBLICO || 'gustavoduia/duiaos-fontes-abertas' }}
  # Só a main e as tags publicam; disparado à mão numa branch, só gera os pacotes.
  PUBLICAR: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  pacotes:
    name: Gerar e publicar os pacotes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags: a versão parte da última tag

      - name: EULA e licenças (duiaos-fontes-abertas, ADR 043)
        uses: actions/checkout@v4
        with:
          repository: gustavoduia/duiaos-fontes-abertas
          ref: main
          path: fontes-abertas

      - name: Ferramentas
        run: |
          command -v apt-ftparchive >/dev/null && command -v zstd >/dev/null \
            || sudo apt-get install -y -qq apt-utils zstd

      - name: Versão
        run: bash pacotes/versao.sh | tee -a "${GITHUB_ENV}"

      - name: Lançamento só no commit mais novo da main (ADR 074)
        if: startsWith(github.ref, 'refs/tags/v')
        # A versão X.Y.Z é maior que todas as X.Y.(Z-1)+git...: numa tag de um commit
        # antigo, os computadores voltariam para um código mais velho.
        run: |
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A tag ${GITHUB_REF_NAME} não está no commit mais novo da main. Lance a partir da main atual." >&2
            exit 1
          fi

      - name: Fichas de atualização (ADR 046)
        run: python3 ferramentas/atualizacoes.py conferir

      - name: Chave de assinatura
        env:
          CHAVE_PRIVADA: ${{ secrets.DUIAOS_APT_CHAVE }}
        run: |
          if [ -z "${CHAVE_PRIVADA}" ]; then
            if [ "${PUBLICAR}" = "true" ]; then
              echo "Falta o segredo DUIAOS_APT_CHAVE. Rode no Mac: bash ferramentas/criar-chave-apt.sh" >&2
              exit 1
            fi
            echo "::warning::Sem o segredo DUIAOS_APT_CHAVE: pacotes sem o repositório de atualizações."
            exit 0
          fi
          printf '%s\n' "${CHAVE_PRIVADA}" | gpg --batch --quiet --import
          gpg --batch --export > pacotes/chave.gpg

      - name: Gerar os pacotes
        env:
          DUIAOS_TOKEN_WISE: ${{ secrets.DUIAOS_TOKEN_WISE }}
          DUIAOS_TOKEN_APPS: ${{ secrets.DUIAOS_TOKEN_APPS }}
        run: |
          CHAVE=""
          [ -s pacotes/chave.gpg ] && CHAVE="${PWD}/pacotes/chave.gpg"
          CHAVE_PUBLICA="${CHAVE}" bash pacotes/construir.sh saida
          # Ollama (ADR 030): um pacote por arquitetura, do release oficial sem CUDA.
          # A versão só muda com o arquivo pacotes/duiaos-ollama/VERSAO; o
          # publicar.sh mantém a cópia já publicada da mesma versão.
          bash pacotes/duiaos-ollama/construir.sh amd64 saida
          bash pacotes/duiaos-ollama/construir.sh arm64 saida
          # Motor web do Ora e do Mail Box (ADR 072): Qt WebEngine fixado em pacotes/duiaos-motor-web/VERSAO
          bash pacotes/duiaos-motor-web/construir.sh amd64 saida
          bash pacotes/duiaos-motor-web/construir.sh arm64 saida
          # Voz do sistema (ADR 063): o duiaos-voz (GPL-3, do duiaos-fontes-abertas) e o motor sherpa-onnx,
          # um pacote por arquitetura; a versão só muda com pacotes/duiaos-voz/VERSAO
          bash pacotes/duiaos-voz/construir.sh amd64 saida
          bash pacotes/duiaos-voz/construir.sh arm64 saida
          # Wise (ADR 042): parte nativa do sistema, do repositório privado duiaos-wise
          bash pacotes/trazer-wise.sh saida
          # Ora e Mail Box (ADR 073): aplicativos padrão, dos repositórios privados duiaos-ora e duiaos-mailbox
          bash pacotes/trazer-apps.sh saida

      - name: Emulação de ARM (para conferir o motor web arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Motor web instala e abre num Debian 13 limpo (ADR 075)
        # Sem isto, uma biblioteca do sistema que falte só numa arquitetura (como o libsnappy no ARM) deixa o
        # Ora e o Mail Box sem abrir nos computadores, e ninguém percebe antes de publicar.
        run: |
          for ARQ in amd64 arm64; do
            mkdir -p "conferir-${ARQ}"
            cp saida/duiaos-motor-web*_"${ARQ}".deb "conferir-${ARQ}/"
            docker run --rm --platform "linux/${ARQ}" -v "${PWD}:/w" -w /w debian:trixie \
              bash pacotes/duiaos-motor-web/conferir-dependencias.sh "conferir-${ARQ}"
          done

      - name: Guardar os pacotes no GitHub (30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: pacotes-${{ env.VERSAO_DEB }}
          path: saida/*.deb
          retention-days: 30

      - name: Publicar no repositório apt
        if: env.PUBLICAR == 'true'
        env:
          GH_TOKEN: ${{ secrets.DUIAOS_TOKEN_PUBLICO }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "Falta o segredo DUIAOS_TOKEN_PUBLICO (veja ferramentas/README.md)." >&2
            exit 1
          fi
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO_PUBLICO}.git"
          if git ls-remote --exit-code --heads "${URL}" gh-pages >/dev/null; then
            git clone -q --depth 1 --branch gh-pages "${URL}" site
          else
            # Primeira publicação: cria a branch gh-pages vazia
            git init -q site
            git -C site checkout -q --orphan gh-pages
            git -C site remote add origin "${URL}"
          fi
          touch site/.nojekyll
          bash pacotes/publicar.sh site/apt saida/*.deb
          # Catálogo das atualizações (código, descrição e detalhes), lido pela Central de Atualizações
          python3 ferramentas/atualizacoes.py catalogo site/apt/atualizacoes.json
          cp pacotes/site/index.html site/index.html
          cd site
          # Histórico de um commit só: os .deb antigos não ficam acumulando no repositório.
          git checkout -q --orphan publicacao
          git add -A
          git -c user.name="DuiaOS" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Repositório apt do DuiaOS: ${VERSAO_DEB}"
          git push -q -f origin publicacao:gh-pages
          echo "Publicado: https://${REPO_PUBLICO%%/*}.github.io/${REPO_PUBLICO#*/}/apt (versão ${VERSAO_DEB}, para todos os computadores)"
