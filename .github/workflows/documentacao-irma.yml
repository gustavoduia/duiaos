# DuiaOS — o site e a documentação acompanham o sistema (ADR 039).
# Se o pull request mexe em algo que a pessoa percebe (interface, aplicativos, IA, agente, comandos),
# a descrição precisa citar o PR irmão em gustavoduia/duiaos-websites ("duiaos-websites#N")
# ou dizer "Documentação: não precisa — motivo". Só lê o próprio PR: não usa segredo nenhum.
name: Documentação irmã

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conferir
        env:
          CORPO: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TOPO: ${{ github.event.pull_request.head.sha }}
        run: |
          VISIVEIS='^(shell/|apps/|ia/|agente/|pacotes/[^/]+/raiz/usr/(bin|share/applications)/|branding/)'
          MUDOU="$(git diff --name-only "$BASE" "$TOPO" | grep -E "$VISIVEIS" || true)"
          if [ -z "$MUDOU" ]; then
            echo "Nada visível para o usuário mudou."
            exit 0
          fi
          if printf '%s' "$CORPO" | grep -Eqi 'duiaos-websites(#|/pull/)[0-9]+|Documentação: não precisa'; then
            echo "Documentação tratada."
            exit 0
          fi
          echo "::error::Este PR muda algo visível e não cita o PR irmão em gustavoduia/duiaos-websites."
          echo "Arquivos visíveis que mudaram:"
          printf '%s\n' "$MUDOU"
          echo "Cite 'gustavoduia/duiaos-websites#N' na descrição ou escreva 'Documentação: não precisa — motivo'."
          exit 1
