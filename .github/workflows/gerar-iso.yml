# DuiaOS — gera as ISOs x86_64 (amd64) e ARM64 (ADRs 020 e 025).
#
# Para cada arquitetura, escolha ONDE gerar:
#   github  servidores do GitHub (rápido; ISO de teste fica 7 dias em Actions > Artifacts)
#   dell    Dell Latitude (runner próprio, rótulo duiaos-dell)
#   mac     Mac M4 (runner próprio, rótulo duiaos-mac) — só arm64
#   nao     não gerar esta arquitetura
#
# Máquina padrão:
#   - Repositório PÚBLICO (fase atual): github para as duas. Runners próprios
#     ficam desligados e o workflow recusa mac/dell (segurança: em repositório
#     público, um pull request de terceiros poderia rodar código nas máquinas).
#   - Repositório PRIVADO (fase final): amd64 no Dell e arm64 no Mac.
#   - As variáveis DUIAOS_AMD64_EM / DUIAOS_ARM64_EM, se existirem, mandam.
#
# Por que não amd64 no Mac: o Rosetta da Apple não executa programas dentro do
# chroot do debootstrap sem /proc ("rosetta error: Unable to open /proc/self/exe").
# arm64 no Dell funciona via QEMU, mas é lento (1–2 h).
#
# Forma prática de disparar (no Mac):  bash ferramentas/gerar-iso.sh
#
# Quando roda sozinho:
#   - Envio para a main: só amd64, na máquina padrão.
#   - Tag v*, ex.: v0.1.0: as duas, nas máquinas padrão, e publica o Release no
#     repositório público (DUIAOS_REPO_PUBLICO, padrão gustavoduia/duiaos-fontes-abertas)
#     com o segredo DUIAOS_TOKEN_PUBLICO.
#
# ISO de teste em runner próprio: fica na máquina, em ~/Projetos/duiaos-isos.
name: Gerar ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "branding/**"
      - "ferramentas/**"
  workflow_dispatch:
    inputs:
      amd64:
        description: "ISO amd64 (x86_64): onde gerar"
        type: choice
        options: [padrao, github, dell, nao]
        default: padrao
      arm64:
        description: "ISO arm64: onde gerar"
        type: choice
        options: [padrao, github, mac, dell, nao]
        default: padrao

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_PUBLICO: ${{ vars.DUIAOS_REPO_PUBLICO || 'gustavoduia/duiaos-fontes-abertas' }}

jobs:
  plano:
    name: Planejar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matriz: ${{ steps.plano.outputs.matriz }}
      versao: ${{ steps.plano.outputs.versao }}
      release: ${{ steps.plano.outputs.release }}
    steps:
      - id: plano
        env:
          ENTRADA_AMD64: ${{ inputs.amd64 }}
          ENTRADA_ARM64: ${{ inputs.arm64 }}
          VAR_AMD64: ${{ vars.DUIAOS_AMD64_EM }}
          VAR_ARM64: ${{ vars.DUIAOS_ARM64_EM }}
          PRIVADO: ${{ github.event.repository.private }}
        run: |
          if [ "${PRIVADO}" = "true" ]; then
            PADRAO_AMD64="${VAR_AMD64:-dell}"; PADRAO_ARM64="${VAR_ARM64:-mac}"
          else
            PADRAO_AMD64="${VAR_AMD64:-github}"; PADRAO_ARM64="${VAR_ARM64:-github}"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ONDE_AMD64="${PADRAO_AMD64}"; ONDE_ARM64="${PADRAO_ARM64}"
            RELEASE=true; VERSAO="${GITHUB_REF_NAME#v}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            ONDE_AMD64="${ENTRADA_AMD64:-padrao}"; ONDE_ARM64="${ENTRADA_ARM64:-padrao}"
            [ "${ONDE_AMD64}" = "padrao" ] && ONDE_AMD64="${PADRAO_AMD64}"
            [ "${ONDE_ARM64}" = "padrao" ] && ONDE_ARM64="${PADRAO_ARM64}"
            RELEASE=false; VERSAO="dev-${GITHUB_SHA::7}"
          else
            ONDE_AMD64="${PADRAO_AMD64}"; ONDE_ARM64="nao"
            RELEASE=false; VERSAO="dev-${GITHUB_SHA::7}"
          fi

          if [ "${RELEASE}" = "true" ] && { [ "${ONDE_AMD64}" = "nao" ] || [ "${ONDE_ARM64}" = "nao" ]; }; then
            echo "Release precisa das duas arquiteturas." >&2; exit 1
          fi

          for ESCOLHA in "amd64:${ONDE_AMD64}" "arm64:${ONDE_ARM64}"; do
            case "${ESCOLHA}" in
              amd64:mac)
                echo "amd64 no Mac não é suportado (Rosetta + debootstrap). Use dell ou github." >&2; exit 1 ;;
              *:mac|*:dell)
                if [ "${PRIVADO}" != "true" ]; then
                  echo "Repositório público: runners próprios desativados por segurança. Use github." >&2; exit 1
                fi ;;
            esac
          done

          item() {  # item ARQ ONDE
            case "$2" in
              mac|dell) echo "{\"arch\":\"$1\",\"onde\":\"$2\",\"runner\":[\"self-hosted\",\"duiaos-$2\"],\"proprio\":true}" ;;
              github)
                if [ "$1" = "amd64" ]; then R="ubuntu-24.04"; else R="ubuntu-24.04-arm"; fi
                echo "{\"arch\":\"$1\",\"onde\":\"github\",\"runner\":\"${R}\",\"proprio\":false}" ;;
              nao) ;;
              *) echo "Opção inválida para $1: $2 (use mac, dell, github ou nao)" >&2; return 1 ;;
            esac
          }
          A="$(item amd64 "${ONDE_AMD64}")"
          B="$(item arm64 "${ONDE_ARM64}")"
          ITENS="$(printf '%s\n%s\n' "${A}" "${B}" | sed '/^$/d' | paste -sd, -)"
          [ -n "${ITENS}" ] || { echo "Nenhuma arquitetura escolhida." >&2; exit 1; }
          MATRIZ="{\"include\":[${ITENS}]}"
          {
            echo "matriz=${MATRIZ}"
            echo "versao=${VERSAO}"
            echo "release=${RELEASE}"
          } >> "${GITHUB_OUTPUT}"
          echo "amd64: ${ONDE_AMD64} | arm64: ${ONDE_ARM64} | versão: ${VERSAO} | release: ${RELEASE}"

  preparar-release:
    name: Preparar release (rascunho)
    needs: plano
    if: needs.plano.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.DUIAOS_TOKEN_PUBLICO }}
      VERSAO: ${{ needs.plano.outputs.versao }}
    steps:
      - uses: actions/checkout@v4      # notas-de-versao/
      - name: Criar o rascunho no repositório público
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "Falta o segredo DUIAOS_TOKEN_PUBLICO (veja ferramentas/README.md)." >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${REPO_PUBLICO}" >/dev/null 2>&1; then
            echo "O release ${GITHUB_REF_NAME} já existe; os arquivos serão substituídos."
            exit 0
          fi
          # Novidades (notas-de-versao/X.Y.Z.md): as linhas "- ..." viram a lista do site.
          # Os arquivos vão numa tabela, para não aparecerem como novidades.
          NOVIDADES="notas-de-versao/${VERSAO}.md"
          if [ ! -s "${NOVIDADES}" ]; then
            echo "Falta ${NOVIDADES}." >&2; exit 1
          fi
          { cat "${NOVIDADES}"; echo; } > notas.md
          cat >> notas.md <<EOF
          ## Arquivos

          | Arquivo | Para |
          | --- | --- |
          | \`duiaos-${VERSAO}-amd64.iso\` | Computadores comuns (Intel/AMD, x86_64) |
          | \`duiaos-${VERSAO}-arm64.iso\` | Computadores ARM64 |
          | \`.sha256\` / \`.packages\` | Conferência do download / lista de pacotes e versões |

          Uso regido pelo [EULA](https://github.com/${REPO_PUBLICO}/blob/main/EULA.md).
          Licenças de terceiros e código-fonte: [LICENCAS-DE-TERCEIROS.md](https://github.com/${REPO_PUBLICO}/blob/main/LICENCAS-DE-TERCEIROS.md).
          EOF
          # Versões 0.x e com hífen (ex.: 1.0.0-beta) saem como pré-release.
          EXTRA=""
          if [[ "${GITHUB_REF_NAME}" == v0.* || "${GITHUB_REF_NAME}" == *-* ]]; then
            EXTRA="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" --repo "${REPO_PUBLICO}" --draft \
            --title "DuiaOS ${VERSAO}" --notes-file notas.md ${EXTRA}

  iso:
    name: ISO ${{ matrix.arch }} (${{ matrix.onde }})
    needs: [plano, preparar-release]
    if: ${{ !cancelled() && needs.plano.result == 'success' && needs.preparar-release.result != 'failure' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plano.outputs.matriz) }}
    env:
      DUIAOS_VERSION: ${{ needs.plano.outputs.versao }}
      ARCH: ${{ matrix.arch }}
      # Nome fixo do container: permite pará-lo se o job for cancelado.
      CONTAINER: duiaos-build-${{ github.run_id }}-${{ matrix.arch }}
    steps:
      - name: Parar builds antigos que ficaram rodando nesta máquina
        if: matrix.proprio
        run: |
          ANTIGOS="$(docker ps -aq --filter 'name=^duiaos-build-')"
          if [ -n "${ANTIGOS}" ]; then
            echo "Parando containers de builds anteriores: ${ANTIGOS}"
            # shellcheck disable=SC2086
            docker rm -f ${ANTIGOS}
          fi

      - name: Baixar o código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags: a versão dos pacotes parte da última tag

      - name: EULA e licenças (duiaos-fontes-abertas, ADR 043)
        uses: actions/checkout@v4
        with:
          repository: gustavoduia/duiaos-fontes-abertas
          ref: main
          path: fontes-abertas

      - name: Versão dos pacotes e chave do repositório apt
        env:
          CHAVE_PRIVADA: ${{ secrets.DUIAOS_APT_CHAVE }}
        run: |
          bash pacotes/versao.sh | tee -a "${GITHUB_ENV}"
          # Só a chave PÚBLICA vai para a ISO (o sistema confere as atualizações com ela).
          if [ -n "${CHAVE_PRIVADA}" ]; then
            GNUPGHOME="$(mktemp -d)"
            export GNUPGHOME
            printf '%s\n' "${CHAVE_PRIVADA}" | gpg --batch --quiet --import
            gpg --batch --export > pacotes/chave.gpg
            rm -rf "${GNUPGHOME}"
          else
            echo "::warning::Sem o segredo DUIAOS_APT_CHAVE: a ISO sai sem o repositório de atualizações."
          fi

      - name: Wise (repositório privado; ADR 042)
        env:
          DUIAOS_TOKEN_WISE: ${{ secrets.DUIAOS_TOKEN_WISE }}
          VERSAO_SISTEMA: ${{ env.VERSAO_SISTEMA }}
        # Gerado aqui fora: o token não entra no container da ISO. build.sh instala o .deb na ISO.
        run: bash pacotes/trazer-wise.sh pacotes/externos

      - name: Preparar emulação (se a arquitetura não for a desta máquina)
        run: |
          case "$(uname -m)" in
            x86_64|amd64) NATIVA=amd64 ;;
            arm64|aarch64) NATIVA=arm64 ;;
            *) NATIVA=desconhecida ;;
          esac
          echo "Máquina: $(uname -s) ${NATIVA} | ISO: ${ARCH}"
          if [ "${NATIVA}" = "${ARCH}" ]; then echo "Nativa, sem emulação."; exit 0; fi
          if docker run --rm --platform "linux/${ARCH}" debian:trixie true 2>/dev/null; then
            echo "Emulação de ${ARCH} já disponível (Rosetta ou QEMU)."
          else
            echo "Instalando a emulação QEMU para ${ARCH} (vale até a máquina reiniciar)."
            docker run --rm --privileged tonistiigi/binfmt --install "${ARCH}"
            docker run --rm --platform "linux/${ARCH}" debian:trixie true
          fi

      - name: Gerar a ISO dentro do Debian 13
        run: |
          docker run --rm --privileged --name "${CONTAINER}" \
            --platform "linux/${ARCH}" \
            -v "${PWD}:/work" -w /work \
            -e ARCH="${ARCH}" \
            -e DUIAOS_VERSION="${DUIAOS_VERSION}" \
            -e VERSAO_DEB="${VERSAO_DEB}" \
            -e SUITE="${SUITE}" \
            debian:trixie \
            bash build/build.sh

      - name: Parar o container se o job foi cancelado
        if: always()
        run: docker rm -f "${CONTAINER}" >/dev/null 2>&1 || true

      - name: Devolver a pasta out/ ao usuário do runner
        if: always()
        run: |
          if [ -d out ]; then
            docker run --rm -v "${PWD}:/work" debian:trixie chown -R "$(id -u):$(id -g)" /work/out
          fi

      - name: Publicar no release
        if: needs.plano.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.DUIAOS_TOKEN_PUBLICO }}
        run: gh release upload "${GITHUB_REF_NAME}" out/* --repo "${REPO_PUBLICO}" --clobber

      - name: Guardar a ISO de teste no GitHub (7 dias)
        if: needs.plano.outputs.release != 'true' && !matrix.proprio
        uses: actions/upload-artifact@v4
        with:
          name: duiaos-${{ env.DUIAOS_VERSION }}-${{ matrix.arch }}
          path: out/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Guardar a ISO nesta máquina
        if: needs.plano.outputs.release != 'true' && matrix.proprio
        run: |
          DESTINO="${HOME}/Projetos/duiaos-isos"
          mkdir -p "${DESTINO}"
          cp out/* "${DESTINO}/"
          # Mantém só as 3 ISOs de teste mais recentes desta arquitetura.
          # (nomes de ISO não têm espaços)
          # shellcheck disable=SC2012
          ls -t "${DESTINO}"/duiaos-dev-*-"${ARCH}".iso 2>/dev/null | tail -n +4 | while read -r ISO; do
            rm -f "${ISO}" "${ISO}.sha256" "${ISO%.iso}.packages"
          done || true
          echo "ISO guardada em ${DESTINO}:"
          ls -lh "${DESTINO}"

      - name: Limpar
        if: always()
        run: rm -rf out

  publicar-release:
    name: Publicar release
    needs: [plano, iso]
    if: needs.plano.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.DUIAOS_TOKEN_PUBLICO }}
    steps:
      - name: Tirar do rascunho
        run: |
          gh release edit "${GITHUB_REF_NAME}" --repo "${REPO_PUBLICO}" --draft=false
          gh release view "${GITHUB_REF_NAME}" --repo "${REPO_PUBLICO}"
