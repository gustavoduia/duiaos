# DuiaOS — publica o site (apresentação + documentação) no Cloudflare Workers (ADR 038).
# Roda a cada envio para a main que mexe em site/ e pelo botão "Run workflow".
# Precisa dos segredos CLOUDFLARE_API_TOKEN (permissões: Workers Scripts, D1 e Workers KV: Edit)
# e CLOUDFLARE_ACCOUNT_ID. Sem eles, o build roda e o deploy é pulado.
# Pull requests não publicam (repositório público: nunca expor segredos a código de terceiros).
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      TEM_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Banco de dados (migrações do D1)
        if: github.event_name != 'pull_request' && env.TEM_TOKEN == 'true'
        run: npx wrangler d1 migrations apply duiaos-site --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publicar
        if: github.event_name != 'pull_request' && env.TEM_TOKEN == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
